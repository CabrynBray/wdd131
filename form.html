<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131 - Dynamic Web Fundamentals - Cabryn Bray</title>
    <meta name="description" content="WDD 131 - Dynamic Web Fundamentals - Cabryn Bray - Form Review">
    <meta name="author" content="Cabryn Bray">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/from.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">

            <label for="productName">Product Name</label>
            <select id="productName" name="productName" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <fieldset>
                <legend>Overall Rating</legend>
                <div class="rating">
                    <div>
                        <input type="radio" id="one" name="rating" value="1" required>
                        <label for="one">☆</label>
                        <span>1</span>
                    </div>
                    <div>
                        <input type="radio" id="two" name="rating" value="2" required>
                        <label for="two">☆☆</label>
                        <span>2</span>
                    </div>
                    <div>
                        <input type="radio" id="three" name="rating" value="3" required>
                        <label for="three">☆☆☆</label>
                        <span>3</span>
                    </div>
                    <div>
                        <input type="radio" id="four" name="rating" value="4" required>
                        <label for="four">☆☆☆☆</label>
                        <span>4</span>
                    </div>
                    <div>
                        <input type="radio" id="five" name="rating" value="5" required>
                        <label for="five">☆☆☆☆☆</label>
                        <span>5</span>
                    </div>
                </div>
            </fieldset>

            <label for="installDate">Date of Installation</label>
            <input type="date" id="installDate" name="installDate" required>

            <fieldset>
                <legend>Useful Features</legend>
                <p>Which features did you find useful? (Check all that apply)</p>

                <label for="durability">
                    <input type="checkbox" id="durability" name="features" value="Durability">
                    Durability
                </label>

                <label for="ease">
                    <input type="checkbox" id="ease" name="features" value="Ease of Use">
                    Ease of Use
                </label>

                <label for="performance">
                    <input type="checkbox" id="performance" name="features" value="Performance">
                    Performance
                </label>

                <label for="design">
                    <input type="checkbox" id="design" name="features" value="Design">
                    Design
                </label>
            </fieldset>

            <label for="writtenReview">Written Review (Optional)</label>
            <textarea id="writtenReview" name="writtenReview" rows="5"></textarea>

            <label for="userName">Your Name (Optional)</label>
            <input type="text" id="userName" name="userName">

            <input type="submit" value="Submit Review">

        </form>
    </main>

    <footer>
        <p>&copy; 2026 | Cabryn Bray | WDD 131</p>
        <p>Product Review Form</p>
    </footer>

</body>

</html>
